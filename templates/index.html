<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>Fake News Detector</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="container">

    <h1>📰 Fake News Detector</h1>

    <form method="POST">

        <textarea
            name="news"
            placeholder="Paste your news here..."
            required></textarea>

        <br>

        <button type="submit">
            Analyze News
        </button>

    </form>

    {% if prediction %}

        <div class="result">
            {{ prediction }}
        </div>

    {% endif %}

</div>

</body>
</html>
